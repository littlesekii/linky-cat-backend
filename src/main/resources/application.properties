# Application
spring.application.name=linky_cat_api
server.port=${SERVER_PORT:1001}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:3001/linkycat}
spring.datasource.username=${DATABASE_USER:lcuser}
spring.datasource.password=${DATABASE_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.smtp.auth=true
spring.mail.properties.smtp.starttls.enable=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800}
jwt.issuer=${JWT_ISSUER:linky_cat_api}

